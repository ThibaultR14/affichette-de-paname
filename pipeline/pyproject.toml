[project]
name = "affichette-pipeline"
version = "0.1.0"
description = "Daily import of Paris independent cinema screenings, TMDB matching, favorite alerts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2",
    "requests>=2.34",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
